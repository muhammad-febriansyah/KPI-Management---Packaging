services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: kpi-app
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql
            - redis

    # nginx:
    #     image: nginx:alpine
    #     container_name: kpi-nginx
    #     ports:
    #         - "8080:80"
    #     volumes:
    #         - .:/var/www/html
    #         - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    #     depends_on:
    #         - app

    mysql:
        image: mysql:8.4
        container_name: kpi-mysql
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MYSQL_DATABASE: db_kpi
            MYSQL_ROOT_PASSWORD: kpiapp121#@!
            MYSQL_USER: kpi_app
            MYSQL_PASSWORD: kpiapp121#@!
        volumes:
            - mysql_data:/var/lib/mysql

    redis:
        image: redis:7-alpine
        container_name: kpi-redis
        restart: unless-stopped

    node:
        image: node:22-alpine
        container_name: kpi-node
        working_dir: /var/www/html
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
    mysql_data:
    node_modules:
